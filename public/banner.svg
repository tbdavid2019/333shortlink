<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081010" />
      <stop offset="50%" stop-color="#0e1f1c" />
      <stop offset="100%" stop-color="#050a0a" />
    </linearGradient>
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="30%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="badgeGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#668235" />
      <stop offset="48%" stop-color="#4c6224" />
      <stop offset="100%" stop-color="#303e16" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4c6224" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Left Content Container -->
  <g transform="translate(100, 100)">
    <!-- Logo Badge -->
    <rect width="120" height="120" rx="32" fill="url(#badgeGrad)" filter="url(#badgeShadow)" />
    <rect x="1" y="1" width="118" height="118" rx="31" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <text x="60" y="58" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang TC', sans-serif" font-weight="900" font-size="42" letter-spacing="-0.5">333</text>
    <text x="61" y="96" text-anchor="middle" fill="#e3eed0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang TC', sans-serif" font-weight="700" font-size="24" letter-spacing="4">短址</text>

    <!-- Main Title -->
    <text x="156" y="72" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">333shortlink</text>
    <text x="156" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#34d399">⚡ 極速開源・安全隱私・即時分析短網址</text>

    <!-- Description Paragraph -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">
      Modern, High-Performance Open-Source URL Shortener.
    </text>
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
      Fast Redirection • Real-time Analytics • Biometric Passkeys • Custom Transition Pages
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#132a24" stroke="#10b981" stroke-width="1.5" />
      <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Fast Redirection</text>

      <!-- Pill 2 -->
      <rect x="196" y="0" width="200" height="48" rx="24" fill="#132a24" stroke="#10b981" stroke-width="1.5" />
      <text x="296" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Passkey WebAuthn</text>

      <!-- Pill 3 -->
      <rect x="412" y="0" width="210" height="48" rx="24" fill="#132a24" stroke="#10b981" stroke-width="1.5" />
      <text x="517" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Real-time Analytics</text>

      <!-- Pill 4 -->
      <rect x="638" y="0" width="200" height="48" rx="24" fill="#132a24" stroke="#10b981" stroke-width="1.5" />
      <text x="738" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Custom Transition</text>

      <!-- Pill 5 -->
      <rect x="854" y="0" width="146" height="48" rx="24" fill="#132a24" stroke="#10b981" stroke-width="1.5" />
      <text x="927" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Open Source</text>
    </g>
  </g>
</svg>
